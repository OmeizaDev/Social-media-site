<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <title>Home</title>
    <link rel="icon" type="image/png" href="./images/Logo_lite.png">
    <link rel="stylesheet" href="./src/css/home.css">
    <link rel="stylesheet" href="./src/css/global.css">
    <link rel="stylesheet" href="./src/css/sidebar.css">
    <link rel="stylesheet" href="./src/css/logutModal.css">
    <link rel="stylesheet" href="./src/css/newMsgModal.css">
    <link rel="stylesheet" href="./src/css/message-list.css">
    <link rel="stylesheet" href="./src/css/post-comment.css">
    <link rel="stylesheet" href="./src/css/createPost.css">
    <link rel="stylesheet" href="./src/css/changePassword.css">
    <link rel="stylesheet" href="./src/css/createStory.css">
    <link rel="stylesheet" href="./src/css/storyViewer.css">
    <link rel="stylesheet" href="./src/css/loading.css">
</head>
<body>

    <!--  Navigation Bar  -->
    

    <!------------   Main Section   ------------>
    <main>
        <div class="main-container">

             <!------------  Sidebar  ------------>
             
              <div class="left">

              </div>

              <nav class="header">
                <div class ="nav-container">
                    <div class="header-logo">
                        <a href="index.html">
                            <img src="./images/Logo_lite.png" class="logo-image" alt="Logo">
                        </a> 
                    </div>
                    <div class="search-bar">
                        <button class="search-btn">
                            <span class="material-symbols-outlined"> search </span>
                        </button>
                        <input type="text" name="" class="post-input" id="search-users" placeholder="Search for creators, inspirations, projects">
                        <div id="search-results" class="search-results hidden"></div>
                    </div>
                    <div class="create-post-img">
                        <button class="create-btn">Create post</button>

                        <div class="mobile-search">
                            <button class="mobile-search-btn">
                                <span class="material-symbols-outlined">search</span>
                            </button>

                            <div class="mobile-search-bar">
                                <input
                                    type="text"
                                    id="search-users-mobile"
                                    class="post-input"
                                    placeholder="Search users"
                                >

                                <div id="search-results-mobile" class="search-results hidden"></div>
                            </div>
                        </div>

                        <div class="home-profile-image-container">
                            <a href="./pages/profile-page.html">
                                <img src="" class="profile-img userImg" alt="">
                            </a>
                        </div>

                    </div>

                </div>
              </nav>
              
            
        <!---------------------Middle-------------------------->

        <div class="middle" id="home-section">

            <!------------------  User story  -------------------->
            <div class="stories">
                <div class="stories-container">
                    <div class="user-story create-story">
                        <div class="user-story-content">
                            <button class="create-story-btn">
                                <span class="material-symbols-outlined">add</span>
                            </button>
                            <p class="story-name">Create story</p>
                        </div>
                    </div>
                    <div class="user-story my-story">
                    </div> 

                    <div class="feed-stories">

                    </div>

                </div>
            </div>

            <div class="story-viewer-wrapper">
            </div>
            
            <!------------- End of Story ------------------>

             <!------------- Feeds ------------------>
            <div class="feeds-container">

            </div>

              </div>

              
           <!---------------------Right-------------------------->

            <div class="right" id="messages-section">

            </div>
    </main>

   <div class="logout-popup">
    
   </div>

   <div class="start-chat-popup">
   </div>

   <div class="post-comments">
    </div>

    <div class="create-post">
        
    </div>

    <div class="change-password-popup"> 
    
    </div>

    <div class="create-story-modal"></div>
    


<script type="module" src="./src/javascript/script.js"></script>
</body>
</html>
