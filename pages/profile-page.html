<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <title>Profile</title>
    <link rel="icon" type="image/png" href="../../images/Logo_lite.png">
    <link rel="stylesheet" href="../src/css/global.css">
    <link rel="stylesheet" href="../src/css/profile.css">
    <link rel="stylesheet" href="../src/css/sidebar.css">
    <link rel="stylesheet" href="../src/css/createPost.css">
    <link rel="stylesheet" href="../src/css/logutModal.css">
    <link rel="stylesheet" href="../src/css/changePassword.css">
    <link rel="stylesheet" href="../src/css/loading.css">
</head>
<body>
<div class="profile-grid-container">

  <div class="left">
    
  </div>

  <div class="profile-interface">
    <div class="profile-page">

    <!-- Profile Header -->
    <section class="profile-header">

        <div class="profile-image-container">
            <img class="userImg" src="" alt="">
        </div>

        <div class="profile-info">

            <div class="profile-top">
                <h2 class="display-name"></h2>

                <div class="profile-actions">
                    <button class="edit-profile-btn">
                        Edit Profile
                    </button>

                    <button class="follow-btn">
                        Follow
                    </button>

                    <button class="msg-btn">
                        <span class="material-symbols-outlined">
                            send
                        </span>
                    </button>
                </div>
                
            </div>

            <div class="profile-stats">
                <div>
                    <b class="post-count"></b>
                    <span>Posts</span>
                </div>

                <div>
                    <b class="followers-count"></b>
                    <span>Followers</span>
                </div>

                <div>
                    <b class="following-count"></b>
                    <span>Following</span>
                </div>
            </div>

        </div>

    </section>


    <!-- Tabs -->

    <div class="profile-tabs">

        <button class="active">
            <span class="material-symbols-outlined">
                grid_on
            </span>
            Posts
        </button>

        <button>
            <span class="material-symbols-outlined">
                bookmark
            </span>
            Saved
        </button>

    </div>


    <!-- Posts Grid -->

    <section class="profile-posts">

        <div class="profile-post">
            
        </div>

        <div class="profile-post">
            
        </div>

        <div class="profile-post">
            
        </div>

        <div class="profile-post">
            
        </div>

    </section>


</div>
  </div>
</div>

<div class="create-post">

</div>

<div class="logout-popup">

</div>

<div class="change-password-popup">

</div>

<!--------- Edit profile popUp ----------->

<div class="edit-profile-popup hidden">
  <div class="edit-profile-bg">
    <div class="edit-profile-body">
      <div class="edit-profile-header">
        <h4> Edit Profile </h4>
        <div class="header-icon">
          <span class="material-symbols-outlined"> close </span>
        </div>
      </div>
      <div class="profile-image">
        <div class="profile-details">
          <div class="profile-image-container change-profile-img">
            <img class="profile-img userImg" src="" alt="">
          </div>
          <div class="name-username">
            <h4 class="display-name"></h4>
            <p class="display-username"></p>
          </div>
        </div>
        <div class="profile-image-actions">
    <button class="create-btn change-image-btn">
        Change Image
    </button>
    <input type="file" class="image-input" accept="image/*"  hidden>
</div>
        
      </div>

      <div class="profile-details-container">
        <h4>Personal Details</h4>
        <div class="personal-details-label">
            <label>Name
                <input type="text" class="edit-name" value="Micheal Charlie">
            </label>
            <label>Username
                <input type="text" class="edit-username" value="Mich_charl">
            </label>
            <label>Date of birth
                <input type="date" class="edit-dob" value="1999-05-20">
            </label>
            <label>Gender
                <select name="gender" value="male" class="edit-gender">
                   <option value="male">male</option>
                   <option value="female">female</option>
                </select>
            </label>
        </div>
        <button class="create-btn save-changes">Save Changes</button>
        

      </div>
    </div>
  </div>
</div>

<script type="module" src="../src/javascript/profile.js"></script>
</body>
</html>
