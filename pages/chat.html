<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <title>Messages</title>
    <link rel="icon" type="image/png" href="../images/Logo_lite.png">
    <link rel="stylesheet" href="../src/css/global.css">
    <link rel="stylesheet" href="../src/css/chat.css">
    <link rel="stylesheet" href="../src/css/sidebar.css">
    <link rel="stylesheet" href="../src/css/logutModal.css">
    <link rel="stylesheet" href="../src/css/newMsgModal.css">
    <link rel="stylesheet" href="../src/css/message-list.css">
    <link rel="stylesheet" href="../src/css/createPost.css">
    <link rel="stylesheet" href="../src/css/changePassword.css">
    <link rel="stylesheet" href="../src/css/loading.css">
</head>
<body>
    <div class="message-grid-container">

        <div class="left"></div>

        <div class="messageList"></div>

        <div class="chatInterface">
            
            <!-- Chat Content is Hidden by default -->

            <div class="chat-content hidden">
                <div class="chat-header">
                    <div class="chat-profile-image">
                        <!-- This will be updated by chat.js dynamically -->
                        <img src="" alt="Profile" id="chat-header-image">
                    </div>
                    <div class="user-heading">
                        <div class="user-status-container">
                            <h5 class="user-name" id="chat-user-name">User</h5>
                            <div class="user-status">
                                <span class="online-status online"></span>
                                <p class="Text-muted">Online</p>
                            </div>
                        </div>
                        <div class="chat-actions">
                            <button class="chat-call-btn">
                                <span class="material-symbols-outlined">call</span>
                            </button>
                            <button class="chat-call-btn">
                                <span class="material-symbols-outlined">more_vert</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Message Body will be rendered dynamically by chat.js -->
                <div class="chat-body-container" id="chat-body-container">
                    <!-- Messages will appear here -->
                </div>
            </div>

            <!-- Chat Input Container (Hidden by default) -->
            <div class="chat-input-container hidden">
                <textarea placeholder="Message" class="chat-input"></textarea>
                <button class="send-message-btn">
                    <span class="material-symbols-outlined">send</span>
                </button>
            </div>

            <!-- Empty Chat is Shown by default -->
            <div class="empty-chat">
                <div class="chat-action-txt">
                    <h4>Your messages</h4>
                    <p>Send a message to start a chat</p>
                </div>
                <button class="primary-btn new-chat-btn">Send a message</button>
            </div>
        </div>
        
    </div>
    
    <div class="logout-popup"></div>
    <div class="start-chat-popup"></div>
    <div class="create-post"></div>
    <div class="change-password-popup"></div>

    <script type="module" src="../src/javascript/chat.js"></script>
</body>
</html>
